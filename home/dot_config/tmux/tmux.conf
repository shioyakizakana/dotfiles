# -----------------------------------------------------------
# ステータスラインの配置
# -----------------------------------------------------------

# 以下のサイトでe0と検索するとNerd Fontで使用頻度の高い文字がヒットする
# https://www.nerdfonts.com/cheat-sheet

# ステータスラインのデフォルトカラーを設定
set-option -g status-style "bg=#{c-base-100}"

# #{session_name}(#S):セッション名
# #{host}(#H):ホスト名
# #{window_name}(#W):ウィンドウ名
# #{active_window_index}:アクティブなウィンドウのインデックス
# #{window_bell_flag}:ベルが鳴ったら1を返す

# 左側-------------------------------------------------------
set-option -g status-left-length 100
# セッション名 ウィンドウ番号 ペイン番号]
set-option -g status-left \
  '#[bg=#{@color-info},fg=#{@color-info-content}] Session: #S Window: #I Pane: #P #[bg=#{@color-base-100},fg=#{@color-info}]'
# ウインドウタブ一覧-----------------------------------------
set-option -gw window-status-separator ""

# ウインドウ名->ベル
set-option -gw window-status-format \
  '#[bg=#{c-base-100},fg=#{?window_bell_flag,#{c-info},#{c-neutral}}]#[bg=#{?window_bell_flag,#{c-info},#{c-neutral}},fg=#{?window_bell_flag,#{c-info-content},#{c-neutral-content}}] #{?window_bell_flag,󱅫 ,}#W #[bg=#{c-base-100},fg=#{?window_bell_flag,#{c-info},#{c-neutral}}]'
# デフォルト設定ではベルが鳴るとスタイルが反転するので明示指定
set-option -gw window-status-bell-style "bold"
# 右側-------------------------------------------------------
# mm/dd(a) H:M
set-option -g status-right \
  '#[bg=#{@color-base-100},fg=#{@color-info}]#[bg=#{@color-info},fg=#{@color-info-content}]%m/%d(%a) %H:%M #[bg=#{@color-base-100},fg=#{@color-info}]'
# -----------------------------------------------------------
# ボーダー
# -----------------------------------------------------------
# ペインボーダーのカラー指定
set-option -g pane-border-style "fg=#{c-base-content}"
set-option -g pane-active-border-style "fg=#{c-primary}"
set-option -g pane-border-indicators both

# -----------------------------------------------------------
# メッセージ
# -----------------------------------------------------------
set-option -g message-style "bg=#{c-info},fg=#{c-info-content},bold"

# status-keysがviで、insertモード以外のとき
set-option -g message-command-style "bg=#{c-accent},fg=#{c-accent-content}"

# ===========================================================
# プラグイン
# ===========================================================

# ---------------------------------------------------------
# セッション管理
# ---------------------------------------------------------
# 任意のタイミングでセッションを保存・復帰
set-option -g @plugin "tmux-plugins/tmux-resurrect"
# セッション保存・復帰の自動化
set-option -g @plugin "tmux-plugins/tmux-continuum"

# resurrect-saveのデフォルトであるprefix+C-sを解除(誤爆防止)
unbind-key -T prefix C-s
# prefix+Alt+sに変更 
set-option -g @resurrect-save "M-s"

# 最後にプラグインマネージャー初期化
run "~/.config/tmux/plugins/tpm/tpm"

