# ===========================================================
# 基本設定
# ===========================================================
# prefixをCtrl+sに設定
set-option -g prefix C-s
# 256色対応
set-option -g default-terminal "tmux-256color"
set-option -gu terminal-features
# 上線を有効化
set-option -sa terminal-features ',*:overline'
set-option -sa terminal-features ",*:RGB"
set-option -g allow-passthrough on

set-option -g repeat-time 5000

# マウス操作を有効化
set-option -g mouse on

# デフォルトシェルをzshに設定
set-option -g default-shell /bin/zsh

# 番号基準値を変更
set-option -g base-index 1
# ===========================================================
# キーバインド
# ===========================================================
# tmux.conf再読み込み
bind-key -N "再読み込み" r {
  source-file ~/.config/tmux/tmux.conf
  display-message "Reload Config!!"
}
# 誤爆防止
unbind-key Space # 元 レイアウト変更
unbind-key t # 元 時計表示
# ---------------------------------------------------------
# ペイン
# ---------------------------------------------------------
bind-key c new-window -c "#{pane_current_path}"
# | でペインを縦に分割する
bind-key | split-window -h -c '#{pane_current_path}'
bind-key \\ split-window -h -c '#{pane_current_path}'

# - でペインを横に分割する
bind-key - split-window -v -c '#{pane_current_path}'

# Vimのキーバインドでペインを移動する
bind-key h if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key k if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key l if-shell -F '#{pane_at_right}' '' 'select-pane -R'

bind-key m display-popup -E -w 80% -h 80% "tmux-session-manager"
bind-key M display-popup -E -w 80% -h 80% "tmux-move-window"
bind-key w {
  display-popup -E -w 80% -h 80% -d '#{pane_current_path}' "tmux-ghq '#{pane_id}'"
  if-shell -F '#{@ghq_cd}' {
    # そのままでは展開されないため、run-shell経由
    run-shell 'tmux send-keys "cd #{@ghq_cd}" Enter'
    set-option -gu @ghq_cd
  }
}

bind-key f display-panes
set-option -g display-panes-time 90000

# Vimのキーバインドでペインをリサイズする
# -r repeat-timeで指定したミリ秒間prefixを押さずに連続入力できる
bind-key -r H resize-pane -L
bind-key -r J resize-pane -D
bind-key -r K resize-pane -U
bind-key -r L resize-pane -R

bind-key -N "一時的にペインズーム" -n M-z resize-pane -Z

bind-key -N "ペインIDの表示" P {
  if-shell "which xsel" {
    run-shell 'echo "#{pane_id}" | xsel -bo'
    display-message "Buffer pane_id #{pane_id}";
  }
}

# ペインをkillしてカレントディレクトリ維持しつつ再起動
bind-key -N "ペインを再起動" Q respawn-pane -k -c '#{pane_current_path}'
bind-key -N "ペインを再起動" q confirm-before -p "respawn-pane? (y/others)" "respawn-pane -k -c '#{pane_current_path}'"

# M = Alt
# -n prefixキーを押さなくて良い
bind-key -n M-p previous-window
bind-key -n M-n next-window
bind-key -n M-k { switch-client -p; refresh-client -S }
bind-key -n M-j { switch-client -n; refresh-client -S }

# ウィンドウの入れ替え
bind-key -n M-h swap-window -t -1 \; previous-window
bind-key -n M-l swap-window -t +1 \; next-window

# ---------------------------------------------------------
# コピーモード
# ---------------------------------------------------------
# コピーモードでvimのキーバインドを使用
setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
# 行選択
bind-key -T copy-mode-vi V send -X select-line
# 矩形選択
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
# ヤンク
# bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -ib"
# 行ヤンク
# bind-key -T copy-mode-vi Y send -X copy-line
bind-key -T copy-mode-vi Y send -X copy-pipe-and-cancel "xsel -ib"
# クリップボードを有効化
set-option -s set-clipboard on
# クリップボードからペースト
if-shell 'command -v xsel >/dev/null 2>&1' {
  bind-key -N "ペースト" p run-shell \
    'tmux set-buffer -- "$(xsel -bo)" && tmux paste-buffer -p'
}
# ---------------------------------------------------------
# 履歴
# ---------------------------------------------------------
# コマンド履歴を遡る
bind-key -n Up send-keys Up
bind-key -n Down send-keys Down

# -----------------------------------------------------------
# AI エージェント 
# -----------------------------------------------------------
# Alt+qでプロンプトエディタを開く
bind -n M-q run-shell '\
  editprompt resume --target-pane #{pane_id} || \
  tmux split-window -v -l 10 -c "#{pane_current_path}" \
    "editprompt open --editor nvim --always-copy --target-pane #{pane_id}"'

