[settings]
idiomatic_version_file_enable_tools = [
  "go",
  "node",
  "python",
  "ruby",
]
experimental = true

[tools]
7zip = "latest"
age = "latest"
atuin = "latest"
bat = "latest"
bats = "latest"
bun = "latest"
"cargo:sleek" = "latest"
delta = "latest"
deno = "latest"
eza = "latest"
fd = "latest"
ffmpeg = "latest"
gh = "latest"
ghq = "latest"
git-lfs = "latest"
go = "latest"
"go:github.com/babarot/gomi" = "latest"
"go:github.com/nametake/golangci-lint-langserver" = "latest"
"go:github.com/sqls-server/sqls" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
gofumpt = "latest"
golangci-lint = "latest"
imagemagick = "latest"
jq = "latest"
lazydocker = "latest"
lazygit = "latest"
lefthook = "2.2.2"
lua = "5.1" # NeoVim0.12に合わせる
lua-language-server = "latest"
marksman = "latest"
neovim = "latest"
nim = { version = "latest", platforms = { linux-arm64 = { checksum_url = "https://nim-lang.org/download/nim-{{ version }}-linux_arm64.tar.xz.sha256", url = "https://nim-lang.org/download/nim-{{ version }}-linux_arm64.tar.xz" }, linux-x64 = { checksum_url = "https://nim-lang.org/download/nim-{{ version }}-linux_x64.tar.xz.sha256", url = "https://nim-lang.org/download/nim-{{ version }}-linux_x64.tar.xz" }, macos-arm64 = { checksum_url = "https://nim-lang.org/download/nim-{{ version }}-macosx_arm64.tar.xz.sha256", url = "https://nim-lang.org/download/nim-{{ version }}-macosx_arm64.tar.xz" }, macos-x64 = { checksum_url = "https://nim-lang.org/download/nim-{{ version }}-macosx_x64.tar.xz.sha256", url = "https://nim-lang.org/download/nim-{{ version }}-macosx_x64.tar.xz" }, windows-arm64 = { checksum_url = "https://nim-lang.org/download/nim-{{ version }}_x64.zip.sha256", url = "https://nim-lang.org/download/nim-{{ version }}_x64.zip" }, windows-x64 = { checksum_url = "https://nim-lang.org/download/nim-{{ version }}_x64.zip.sha256", url = "https://nim-lang.org/download/nim-{{ version }}_x64.zip" } }, strip_components = "1", version_date_expr = 'map(filter(split(body, "nightlies/releases/download/"), { # contains "/nim-" && # contains "-linux_x64.tar.xz" }), { [split(split(#, "/nim-")[1], "-linux_x64")[0], #[:10]] })', version_list_url = "https://nim-lang.org/install.html", version_regex = 'nim-(\d+\.\d+\.\d+)-linux_x64\.tar\.xz' }
node = "24"
npm = "latest"
"npm:@astrojs/language-server" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:@olrtg/emmet-language-server" = "latest"
"npm:@openai/codex" = "latest"
"npm:@tailwindcss/language-server" = "latest"
