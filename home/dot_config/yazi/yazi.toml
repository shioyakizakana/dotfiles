[mgr]
show_hidden = true
linemode = "mtime"

[[plugin.prepend_feachers]]
group = "git"
url = "*"
run = "git"

[[plugin.prepend_feachers]]
group = "git"
url = "*/"
run = "git"

[opener]
edit = [
  { run = "$EDITOR %s", block = true ,for = "unix" },
]
preview = [
  { run = "qlmanage -p %s1", desc = "Quick Look Preview" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { url = "*.html", use = [ "open", "edit" ] },
]
